services:
  - type: web
    name: finpilot-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NUGEN_API_KEY
        sync: false
      - key: NUGEN_API_BASE_URL
        sync: false
      - key: NUGEN_TEST_MODEL_ID
        sync: false
      - key: NUGEN_TAX_MODEL_ID
        sync: false
      - key: NUGEN_INVESTMENT_MODEL_ID
        sync: false
      - key: NUGEN_INSURANCE_MODEL_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: FINPILOT_CORRECTION_REVIEW_TOKEN
        sync: false
      - key: SEED_CONTENT_ON_STARTUP
        sync: false
